training:
  algorithm: "ppo"                    # "ppo" or "sac"
  timesteps: 100000                   # timesteps for training
  save_dir: "trained_models"
  log_dir: "logs"
  save_freq: 10000
  device: "cpu"                       # "cuda" or "cpu"
  eval_episodes: 10
  n_envs: "auto"                      # "auto" = cpu_count - 1, or an explicit int (1 = DummyVecEnv, single process)

simulation:
  screen_width: 800
  screen_height: 800
  dt: 0.1

vehicle:
  length: 4.0
  width: 2.0
  wheelbase: 2.5
  max_velocity: 5.0
  max_acceleration: 3.0
  max_deceleration: -5.0
  max_steering_angle: 0.6

environment:
  max_steps: 10000
  num_lidar_rays: 16
  lidar_range: 20.0
  goal_threshold: 3.0
  cte_fail_threshold: 8.0
  grid_resolution: 1.0            # grid resolution cho A* khi plan path gốc
  fog_of_war: false
  replan_lookahead_wp: 5
  replan_grid_resolution: 1.0
  replan_obstacle_radius: 0.5
  enable_recovery: false          # bật ở evaluate/deploy cho map có ngõ cụt hẹp (vd map_5, map_6)
  recovery_trigger_distance: 1.0
  recovery_reverse_steps: 30       # trần an toàn (steps); thoát sớm hơn khi đã đủ trống hoặc bị chặn phía sau
  recovery_escape_margin: 3.0

model:
  learning_rate: 0.0003
  batch_size: 64
  gamma: 0.99
  
  # PPO parammeters
  n_steps: 2048
  ent_coef: 0.01
  
  # SAC parammeters
  buffer_size: 100000
  tau: 0.005

map:
  train_map_yaml_folder: 'maps/yaml'

  evaluate_map_yaml_file: 'maps/yaml/map_1.yaml'